name: Themis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -DskipTests package
      - run: java -jar themis-cli/target/themis.jar scan . --format console,sarif --fail-on CRITICAL --no-open
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: themis-report/themis.sarif
